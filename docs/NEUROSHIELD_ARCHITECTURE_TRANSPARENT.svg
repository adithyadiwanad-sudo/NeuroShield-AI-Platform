<text x="55" y="923" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#192C48">How to explain it</text>
<text x="55" y="971" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#192C48">Inputs go to the API. Analyzers return evidence. The dashboard supports investigation and reporting.</text>
<text x="55" y="1014" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526581">Solid paths: implemented data flow.  Demo telemetry and deception are explicitly simulated.</text>
